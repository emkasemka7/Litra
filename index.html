<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что? Где? Когда? — Литература 8 класс</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#070a10;
    --panel:rgba(18,23,34,.72);
    --stroke:rgba(255,255,255,.09);
    --gold:#f2c14e;
    --gold-soft:#ffe08a;
    --text:#eef3fb;
    --muted:#98a4b8;
    --green:#3ddc84;
    --red:#ff5d5d;
    --r:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
    overflow-x:hidden;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;
  }

  /* ФОН */
  .bg-photo{
    position:fixed; inset:0; z-index:-3;
    background:url('images/bg-16x9.webp') center/cover no-repeat;
    filter:brightness(.55) saturate(1.05);
  }
  .bg-photo::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(1200px 700px at 15% 0%, rgba(242,193,78,.18), transparent 60%),
      radial-gradient(900px 600px at 110% 100%, rgba(61,220,132,.10), transparent 60%),
      linear-gradient(180deg, rgba(7,10,16,.55), rgba(7,10,16,.92));
  }
  .bg-grid{
    position:fixed;inset:0;z-index:-2;opacity:.18;
    background-image:
      linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(circle at 50% 40%, #000 20%, transparent 75%);
  }

  .shell{width:min(1000px,100%);position:relative}

  .screen{display:none}
  .screen.active{display:block;animation:screenIn .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes screenIn{
    0%{opacity:0;transform:translateY(50px) scale(.94)}
    60%{opacity:1;transform:translateY(-6px) scale(1.01)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .screen.leaving{display:block;animation:screenOut .45s ease both}
  @keyframes screenOut{to{opacity:0;transform:translateY(-40px) scale(.96)}}

  .panel{
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid var(--stroke);
    border-radius:var(--r);
    box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    padding:clamp(22px,4vw,48px);
  }

  /* старт */
  .start{text-align:center;position:relative}
  .kicker{
    display:inline-block;font-family:'Unbounded',sans-serif;
    font-size:.72rem;letter-spacing:3px;text-transform:uppercase;
    color:var(--gold);border:1px solid rgba(242,193,78,.35);
    padding:8px 16px;border-radius:99px;margin-bottom:20px;
    background:rgba(242,193,78,.06);
    animation:dropIn .6s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes dropIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  .title{
    font-family:'Unbounded',sans-serif;font-weight:900;
    font-size:clamp(2rem,6vw,4rem);line-height:1.05;letter-spacing:-1px;
    margin-bottom:14px;
    animation:titleIn .8s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes titleIn{
    0%{opacity:0;transform:translateY(40px) skewY(6deg)}
    100%{opacity:1;transform:none}
  }
  .title .grad{
    background:linear-gradient(135deg,var(--gold),var(--gold-soft) 60%,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 200%;animation:shine 4s ease-in-out infinite;
  }
  @keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .subtitle{
    color:var(--muted);font-size:clamp(.95rem,1.6vw,1.1rem);
    max-width:520px;margin:0 auto 36px;line-height:1.6;
    animation:dropIn .6s .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .start-actions{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    animation:dropIn .6s .55s cubic-bezier(.2,.8,.2,1) both;
  }

  .btn{
    font-family:'Unbounded',sans-serif;font-weight:700;font-size:.95rem;
    padding:16px 34px;border-radius:16px;border:none;cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    letter-spacing:.3px;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    color:#14181f;box-shadow:0 14px 36px rgba(242,193,78,.4);
  }
  .btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 22px 48px rgba(242,193,78,.55)}
  .btn-primary:active{transform:translateY(0) scale(.98)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 14px 36px rgba(242,193,78,.4)}
    50%{box-shadow:0 14px 50px rgba(242,193,78,.75),0 0 0 6px rgba(242,193,78,.15)}
  }

  /* викторина */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h2{
    font-family:'Unbounded',sans-serif;font-size:.95rem;font-weight:700;
    flex:1;letter-spacing:.2px;
    animation:spinOnce .8s ease both;
  }
  @keyframes spinOnce{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
  .topbar h2 span{color:var(--gold)}

  .progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:8px}
  .progress .bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    border-radius:99px;box-shadow:0 0 18px rgba(242,193,78,.7);
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:26px}
  .meta b{color:var(--gold)}

  /* карточка вопроса */
  .qcard{
    display:grid;gap:26px;align-items:start;
    animation:slideInRight .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .qcard.with-img{grid-template-columns:200px 1fr}
  .qcard.no-img{grid-template-columns:1fr}
  @keyframes slideInRight{
    0%{opacity:0;transform:translateX(80px) rotateY(-10deg)}
    100%{opacity:1;transform:none}
  }
  .qcard.leaving{animation:slideOutLeft .4s ease both}
  @keyframes slideOutLeft{to{opacity:0;transform:translateX(-90px) rotateY(10deg)}}

  /* картинка до ответа */
  .thumb{
    aspect-ratio:3/4;border-radius:18px;overflow:hidden;
    border:1px solid var(--stroke);
    box-shadow:0 18px 40px rgba(0,0,0,.5);position:relative;
    animation:thumbIn .6s .1s cubic-bezier(.2,.8,.2,1) both;
    background:linear-gradient(180deg,#141a26,#0b0f14);
  }
  @keyframes thumbIn{
    from{opacity:0;transform:scale(.8) rotate(-6deg)}
    to{opacity:1;transform:none}
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .8s ease;
  }
  .thumb:hover img{transform:scale(1.06)}
  .thumb::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5));
  }
  .thumb.missing::before{
    content:"нет картинки";
    position:absolute;inset:0;display:grid;place-items:center;
    color:var(--muted);font-size:.8rem;
    background:repeating-linear-gradient(45deg,#0f1520,#0f1520 10px,#131a26 10px,#131a26 20px);
  }

  /* блок-раскрытие после ответа */
  .reveal{
    margin-top:18px;
    display:flex;align-items:center;gap:16px;
    padding:12px;
    border-radius:16px;
    border:1px dashed rgba(242,193,78,.35);
    background:rgba(242,193,78,.06);
    animation:revealIn .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes revealIn{
    0%{opacity:0;transform:translateY(20px) scale(.96)}
    100%{opacity:1;transform:none}
  }
  .reveal .thumb{
    width:120px;aspect-ratio:3/4;flex:0 0 auto;
    animation:none;
  }
  .reveal .rtext{font-size:.85rem;color:var(--muted);line-height:1.5}
  .reveal .rtext b{color:var(--gold-soft)}
  .reveal.missing::before{content:none}

  .qtext{
    font-family:'Unbounded',sans-serif;font-weight:500;
    font-size:clamp(1rem,1.9vw,1.3rem);line-height:1.5;margin-bottom:22px;
  }

  /* варианты ответа */
  .options{display:grid;gap:11px}
  .opt{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:'Inter',sans-serif;font-size:1rem;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);
    border-radius:14px;padding:14px 16px;cursor:pointer;
    transition:transform .18s ease, border-color .18s, background .18s;
    animation:optIn .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .opt:nth-child(1){animation-delay:.15s}
  .opt:nth-child(2){animation-delay:.22s}
  .opt:nth-child(3){animation-delay:.29s}
  .opt:nth-child(4){animation-delay:.36s}
  @keyframes optIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  .opt:hover:not(:disabled){
    transform:translateX(6px) scale(1.01);
    border-color:rgba(242,193,78,.5);
    background:rgba(242,193,78,.08);
  }
  .opt .letter{
    flex:0 0 34px;height:34px;display:grid;place-items:center;
    border-radius:10px;background:rgba(242,193,78,.14);color:var(--gold);
    font-weight:900;font-family:'Inter',sans-serif;transition:.18s;
    font-size:1.1rem;
  }
  .opt:hover:not(:disabled) .letter{background:var(--gold);color:#14181f}
  .opt.correct{border-color:var(--green);background:rgba(61,220,132,.14);animation:pop .45s ease}
  .opt.correct .letter{background:var(--green);color:#07120b}
  .opt.wrong{border-color:var(--red);background:rgba(255,93,93,.13);animation:shake .45s ease}
  .opt.wrong .letter{background:var(--red);color:#fff}
  .opt:disabled{cursor:default;opacity:.85}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)}80%{transform:translateX(5px)}
  }

  .qfooter{margin-top:26px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
  .qfooter .btn{animation:dropIn .5s .45s ease both}

  /* результат */
  .result{text-align:center;padding:10px}
  .medal{font-size:4.5rem;display:inline-block;animation:medalIn 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes medalIn{
    0%{opacity:0;transform:scale(.2) rotate(-360deg)}
    60%{opacity:1;transform:scale(1.2) rotate(20deg)}
    100%{transform:scale(1) rotate(0)}
  }
  .score-big{
    font-family:'Unbounded',sans-serif;font-weight:900;
    font-size:clamp(3rem,9vw,5.5rem);
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;margin:8px 0;filter:drop-shadow(0 0 30px rgba(242,193,78,.35));
    animation:scoreIn .8s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes scoreIn{
    0%{opacity:0;transform:translateY(40px) scale(.5)}
    70%{opacity:1;transform:scale(1.1)}
    100%{transform:scale(1)}
  }
  .verdict{font-family:'Unbounded',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:6px;animation:dropIn .6s .5s ease both}
  .res-msg{color:var(--muted);margin-bottom:30px;line-height:1.6;animation:dropIn .6s .65s ease both}

  /* ОБЫЧНОЕ ОКНО С ТАНЦОРОМ */
  .dancer-stage{
    position:relative;
    height:260px;
    margin:10px auto 30px;
    max-width:640px;
    overflow:hidden;
    border-radius:18px;
    border:1px dashed rgba(242,193,78,.25);
    background:radial-gradient(circle at 50% 80%, rgba(242,193,78,.12), transparent 70%);
    animation:dropIn .7s .8s ease both;
  }

  /* Подпись «здесь был танцпол» */
  .stage-note{
    position:absolute;
    bottom:8px;
    right:12px;
    font-size:.68rem;
    color:rgba(152,164,184,.55);
    letter-spacing:.3px;
    font-family:'Inter',sans-serif;
    pointer-events:none;
    user-select:none;
  }

  .dancer{
    position:absolute;
    bottom:0;
    left:0;
    height:220px;
    width:auto;
    transform-origin:50% 100%;
    animation:
      moveLeftRight 2.5s ease-in-out infinite alternate,
      fastJump 0.6s ease-in-out infinite,
      wiggle 0.8s ease-in-out infinite alternate;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.5));
    z-index:2;
  }

  @keyframes moveLeftRight{
    0%{left:0%}
    100%{left:calc(100% - 140px)}
  }
  @keyframes fastJump{
    0%{translate:0 0}
    40%{translate:0 -45px}
    60%{translate:0 0}
    100%{translate:0 0}
  }
  @keyframes wiggle{
    from{rotate:-6deg}
    to{rotate:6deg}
  }

  .copyright{margin-top:26px;text-align:center;font-size:.78rem;color:var(--muted);letter-spacing:.4px}
  .copyright b{color:var(--gold-soft);font-weight:600}

  .debug-btn{
    position:fixed;right:16px;bottom:16px;z-index:1000;
    font-family:'Unbounded',sans-serif;font-size:.68rem;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;
    border-radius:12px;border:1px dashed rgba(61,220,132,.5);
    background:rgba(61,220,132,.12);color:var(--green);cursor:pointer;
    backdrop-filter:blur(8px);transition:.2s;
  }
  .debug-btn:hover{background:rgba(61,220,132,.22);border-color:var(--green);transform:translateY(-2px)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  @media (max-width:720px){
    .qcard.with-img{grid-template-columns:1fr}
    .thumb{aspect-ratio:16/9;max-height:180px}
    body{padding:14px}
    .dancer-stage{height:200px}
    .dancer{height:160px}
  }
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-grid"></div>

<div class="shell">

  <!-- СТАРТ -->
  <section class="screen active" id="screen-start">
    <div class="panel start">
      <div class="kicker">Что? Где? Когда?</div>
      <h1 class="title">Литературная <span class="grad">викторина</span></h1>
      <p class="subtitle">8 класс · 5 вопросов.</p>
      <div class="start-actions">
        <button class="btn btn-primary pulse" id="btnStart">Начать игру →</button>
      </div>
      <div class="copyright">© <b>Emil Khaspoladov 8T 2026</b></div>
    </div>
  </section>

  <!-- ВИКТОРИНА -->
  <section class="screen" id="screen-quiz">
    <div class="panel">
      <div class="topbar">
        <h2>Что? Где? <span>Когда?</span></h2>
      </div>

      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="meta">
        <span>Вопрос <b id="cur">1</b> из <b id="total">5</b></span>
        <span>Правильно: <b id="scoreLive">0</b></span>
      </div>

      <div id="qstage"></div>

      <div class="qfooter">
        <button class="btn btn-primary" id="btnNext" disabled>Далее →</button>
      </div>

      <div class="copyright">© <b>Emil Khaspoladov 8T 2026</b></div>
    </div>
  </section>

  <!-- РЕЗУЛЬТАТ -->
  <section class="screen" id="screen-result">
    <div class="panel">
      <div class="result">
        <div class="medal" id="resMedal">🏆</div>
        <div class="score-big" id="resScore">0 / 5</div>
        <div class="verdict" id="resVerdict"></div>
        <p class="res-msg" id="resMsg"></p>

        <div class="dancer-stage">
          <img src="images/dancer.png" alt="Танцующий человечек" class="dancer">
          <div class="stage-note">здесь был танцпол</div>
        </div>

        <div class="start-actions">
          <button class="btn btn-primary" id="btnAgain">Пройти заново ↺</button>
        </div>
      </div>
      <div class="copyright">© <b>Emil Khaspoladov 8T 2026</b></div>
    </div>
  </section>

</div>

<button class="debug-btn" id="debugBtn" title="Перейти в конец (debug)">DEBUG → конец</button>

<audio id="bgMusic" loop preload="auto">
  <source src="audio/music.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------- ВОПРОСЫ ---------- */
const rawQuiz = [
  {
    q: "Какой великий русский писатель имел псевдоним «Навиволырк»?",
    reveal: "images/krylov.jpg",
    options: ["Иван Крылов", "Александр Пушкин", "Николай Гоголь", "Михаил Лермонтов"],
    answer: "Иван Крылов"
  },
  {
    q: "В каком году М. Ю. Лермонтов написал стихотворение «Смерть поэта»?",
    reveal: "images/lermontov.jpg",
    options: ["1835", "1837", "1839", "1841"],
    answer: "1837"
  },
  {
    q: "Кому А. С. Пушкин посвятил стихотворение «Буря мглою небо кроет…»?",
    reveal: "images/aruna-rodionovna.jpg",
    options: ["Жене Наталье Гончаровой", "Няне Арине Родионовне", "Другу Ивану Пущину", "Бабушке Марии Ганнибал"],
    answer: "Няне Арине Родионовне"
  },
  {
    q: "Какое прозвище было у Саши Пушкина в Царскосельском лицее?",
    reveal: "images/pushkin.jpg",
    options: ["Француз", "Немец", "Арапчонок", "Поэт"],
    answer: "Француз"
  },
  {
    q: "Какой талант, помимо поэтического, обнаружил в себе Лермонтов ещё с детства?",
    reveal: "images/lermontov-art.jpg",
    options: ["Музыка", "Живопись", "Архитектура", "Скульптура"],
    answer: "Живопись"
  }
];

const letters = ["А","Б","В","Г"];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let quiz = [];
let index = 0, score = 0, answered = false;

const audio = $("#bgMusic");
const bar = $("#bar");
const curEl = $("#cur");
const totalEl = $("#total");
const scoreLive = $("#scoreLive");
const qstage = $("#qstage");
const btnNext = $("#btnNext");

totalEl.textContent = rawQuiz.length;

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function prepareQuiz() {
  return rawQuiz.map(item => {
    let shuffledOptions = [...item.options];
    shuffle(shuffledOptions);
    return { ...item, options: shuffledOptions };
  });
}

function startGame() {
  quiz = prepareQuiz();
  index = 0;
  score = 0;
  showScreen("screen-quiz");
  renderQuestion();
}

function showScreen(id){
  const current = document.querySelector(".screen.active");
  const target = $("#" + id);
  if (current === target) return;
  if (current){
    current.classList.add("leaving");
    current.classList.remove("active");
    setTimeout(() => current.classList.remove("leaving"), 450);
  }
  target.classList.add("active");
  target.style.animation = "none";
  void target.offsetWidth;
  target.style.animation = "";
}

$("#btnStart").addEventListener("click", () => {
  audio.play().catch(()=>{});
  startGame();
});

function renderQuestion(){
  answered = false;
  const item = quiz[index];

  curEl.textContent = index + 1;
  scoreLive.textContent = score;
  bar.style.width = (index / quiz.length * 100) + "%";

  const hasImg = !!item.img;

  qstage.innerHTML = `
    <div class="qcard ${hasImg ? 'with-img' : 'no-img'}" id="qcard">
      ${hasImg ? `
        <div class="thumb">
          <img src="${item.img}" alt="Иллюстрация к вопросу"
               onerror="console.error('Нет файла:', this.src); this.parentElement.classList.add('missing'); this.remove();">
        </div>` : ''}
      <div>
        <div class="qtext">${item.q}</div>
        <div class="options" id="options">
          ${item.options.map((o,i)=>`
            <button class="opt" data-i="${i}">
              <span class="letter">${letters[i]}</span>
              <span>${o}</span>
            </button>`).join("")}
        </div>
        <div id="revealZone"></div>
      </div>
    </div>
  `;

  $$(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i, b)));
  btnNext.disabled = true;
  btnNext.textContent = (index === quiz.length - 1) ? "Показать результат →" : "Далее →";
}

function choose(i, btn){
  if (answered) return;
  answered = true;

  const item = quiz[index];
  const selectedText = item.options[i];
  const isCorrect = selectedText === item.answer;
  const correctIndex = item.options.indexOf(item.answer);

  $$(".opt").forEach(b => b.disabled = true);

  if (isCorrect){
    btn.classList.add("correct");
    score++;
    scoreLive.textContent = score;
  } else {
    btn.classList.add("wrong");
    $$(".opt")[correctIndex].classList.add("correct");
  }

  bar.style.width = ((index + 1) / quiz.length * 100) + "%";

  if (item.reveal){
    const zone = $("#revealZone");
    zone.innerHTML = `
      <div class="reveal">
        <div class="thumb">
          <img src="${item.reveal}" alt="Иллюстрация-раскрытие"
               onerror="console.error('Нет файла:', this.src); this.parentElement.classList.add('missing'); this.remove();">
        </div>
        <div class="rtext">Иллюстрация к правильному ответу: <b>${item.answer}</b></div>
      </div>
    `;
  }

  btnNext.disabled = false;
}

btnNext.addEventListener("click", () => {
  const card = $("#qcard");
  if (card){
    card.classList.add("leaving");
    setTimeout(() => {
      index++;
      if (index < quiz.length) renderQuestion();
      else showResult();
    }, 380);
  } else {
    index++;
    if (index < quiz.length) renderQuestion();
    else showResult();
  }
});

function showResult(){
  showScreen("screen-result");
  bar.style.width = "100%";

  const percent = Math.round(score / quiz.length * 100);
  let medal, verdict, msg;
  if (percent === 100){ medal="🏆"; verdict="Блестяще!"; msg="Вы настоящий знаток литературы. Так держать!"; }
  else if (percent >= 80){ medal="🥇"; verdict="Отличный результат!"; msg="Материал освоен на отлично."; }
  else if (percent >= 60){ medal="🥈"; verdict="Хороший результат!"; msg="Есть над чем поработать."; }
  else if (percent >= 40){ medal="🥉"; verdict="Неплохо!"; msg="Стоит повторить факты о писателях."; }
  else { medal="📚"; verdict="Нужно повторить"; msg="Не расстраивайтесь — попробуйте снова."; }

  $("#resMedal").textContent = medal;
  $("#resScore").textContent = score + " / " + quiz.length;
  $("#resVerdict").textContent = verdict;
  $("#resMsg").textContent = msg + ` Правильных ответов: ${score} из ${quiz.length} (${percent}%).`;

  if (percent >= 60) confetti();
}

function confetti(){
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const colors = ["#f2c14e","#ffe08a","#3ddc84","#5b8cff","#ff8fab","#fff"];
  for (let i = 0; i < 90; i++){
    const p = document.createElement("i");
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2 + Math.random()*2.5) + "s";
    p.style.animationDelay = (Math.random()*0.8) + "s";
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 5500);
}

$("#btnAgain").addEventListener("click", () => {
  startGame();
});

const DEBUG_SCORE = rawQuiz.length;
$("#debugBtn").addEventListener("click", () => {
  score = Math.min(DEBUG_SCORE, rawQuiz.length);
  quiz = prepareQuiz();
  showResult();
});
</script>
</body>
</html>
